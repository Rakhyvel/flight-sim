name = "Cessna 208B Grand Caravan"
empty_mass = 2150.0                                               # about 4,740 lb
empty_cg = [-0.079, 0.0, 0.0]
fuel_kg_per_kwh = 0.45                                            # about 370 lb/h at cruise
empty_inertia = { roll = 4860.0, yaw = 15510.0, pitch = 13900.0 }
wing_area = 25.96                                                 # 279 sq ft
wingspan = 15.88                                                  # 52 ft 1 in
mean_chord = 1.63
lift_slope = 5.1                                                  # aspect ratio 9.7
zero_lift_coefficient = 0.25                                      # thick, cambered wing
max_cl = 1.5                                                      # about 78 kt stall clean at max weight
min_cl = -0.8
drag_coefficient_base = 0.028                                     # fixed gear and a strut, cruises about 170 kt at 10,000 ft here
oswald_efficiency = 0.75
cy_beta = -0.45                                                   # lots of slab-sided fuselage

max_thrust = 8500.0
max_power = 503000.0   # 675 shp PT6A-114A
prop_efficiency = 0.75

field_length_m = 360.0

control_limits = { elevator = 22.0, aileron = 18.0, rudder = 22.0 }

contacts = [
    # Mains on spring steel legs, a bit behind the center of gravity, 3.6 m apart
    { kind = "wheel", pos = [
        -0.5,
        -1.4,
        -1.78,
    ], radius = 0.3, brakes = true },
    { kind = "wheel", pos = [
        -0.5,
        -1.4,
        1.78,
    ], radius = 0.3, brakes = true },
    # Nose wheel
    { kind = "wheel", pos = [
        3.4,
        -1.45,
        0.0,
    ], radius = 0.25 },
    # Wingtips, high wing
    { kind = "airframe", pos = [
        -0.3,
        1.2,
        -7.9,
    ] },
    { kind = "airframe", pos = [
        -0.3,
        1.2,
        7.9,
    ] },
    # Bottom of the tail cone, stab tips, top of the fin
    { kind = "airframe", pos = [
        -7.0,
        -0.4,
        0.0,
    ] },
    { kind = "airframe", pos = [
        -7.8,
        0.3,
        -3.1,
    ] },
    { kind = "airframe", pos = [
        -7.8,
        0.3,
        3.1,
    ] },
    { kind = "airframe", pos = [
        -8.0,
        2.9,
        0.0,
    ] },
    # Prop tip at its lowest, 106 in prop
    { kind = "airframe", pos = [
        4.4,
        -1.25,
        0.0,
    ] },
]

[derivs]
c_lift_elevator = 0.4
c_side_rudder = 0.2
cm_0 = 0.05
cm_alpha = -1.9
cm_q = -16.0          # long tail arm for the chord
cm_elevator = -1.3
cl_beta = -0.09
cl_aileron = 0.15     # heavier and slower to roll than a 172
cn_beta = 0.07
cn_r = -0.12
cn_rudder = -0.07

[gear]
sag = 0.08
damping = 0.45           # spring steel, a little bouncy
rebound_damping = 2.0
max_brake_friction = 0.4

[flaps]
detents = [0.0, 10.0, 20.0, 30.0]
lift_fraction = [0.0, 0.35, 0.7, 1.0]
delta_cl = 0.9                        # big Fowler flaps
delta_max_cl = 0.95                   # about 61 kt stall at full flaps
delta_cd = 0.07
delta_cm = -0.1
travel_time = 12.0

[[tanks]]
pos = [0.0, 0.0, -2.0]
capacity_kg = 505.0    # 167 gal of Jet A per wing

[[tanks]]
pos = [0.0, 0.0, 2.0]
capacity_kg = 505.0

[[stations]]
name = "flight deck"
pos = [2.0, 0.0, 0.0]
default_kg = 85.0

[[stations]]
name = "cabin front"
pos = [0.0, 0.0, 0.0]

[[stations]]
