title = "LA from the air"
description = """
Depart Santa Monica over the pier, then the Getty,
the Hollywood Sign and Griffith Observatory.
Downtown, then back to Santa Monica runway 21."""
region = "SoCal"
plane = "cessna172"
time_of_day = 17.0 # golden hour on the hills
land = "KSMO 21"

