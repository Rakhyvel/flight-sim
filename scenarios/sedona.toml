title = "Sedona red rocks"
description = """
Off the mesa-top runway past Bell Rock and Cathedral Rock,
up to Devils Bridge and into Oak Creek Canyon.
Back to Sedona runway 21, the mesa drops away on both ends."""
region = "Grand Canyon"
plane = "j3cub"
time_of_day = 17.0 # sunset on the red rock
land = "KSEZ 21"

