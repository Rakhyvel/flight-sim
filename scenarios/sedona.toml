lon = -111.7934
altitude_ft = 5500

[[sight]]
name = "Devils Bridge"
lat = 34.9026
lon = -111.8135
altitude_ft = 6000

[[sight]]
name = "Slide Rock"
lat = 34.9437
lon = -111.7528
altitude_ft = 6800  # Oak Creek Canyon's rims are around 6,500 ft
